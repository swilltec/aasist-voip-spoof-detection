[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_signaling_address=${LAN_IP}
external_media_address=${LAN_IP}

[1001]
type=endpoint
context=local
callerid=1001
disallow=all
allow=ulaw,alaw
auth=1001-auth
aors=1001
direct_media=no
media_address=${LAN_IP}
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[1001-auth]
type=auth
auth_type=userpass
username=1001
password=${SIP_PASSWORD}

[1001]
type=aor
max_contacts=1
remove_existing=yes

[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0

[1002]
type=endpoint
context=local
callerid=1002
disallow=all
allow=ulaw,alaw
auth=1002-auth
aors=1002
webrtc=yes
dtls_auto_generate_cert=yes
direct_media=no
media_address=${LAN_IP}
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[1002-auth]
type=auth
auth_type=userpass
username=1002
password=${SIP_PASSWORD}

[1002]
type=aor
max_contacts=1
remove_existing=yes
