[local]
exten => experiment,1,Answer()
 same => n,Set(CDR(userfield)=${UUID()})
 same => n,Set(EXPERIMENT_CALL_ID=${PJSIP_HEADER(read,X-Experiment-Call-ID)})
 same => n,ExecIf($["${EXPERIMENT_CALL_ID}" != ""]?Set(CDR(userfield)=${EXPERIMENT_CALL_ID}))
 same => n,AudioSocket(${CDR(userfield)},aasist:9019)
 same => n,Hangup()
